# Relais du formulaire de contact de leclosdesclefs.com vers Mailgun (SMTP, EU).
# Memes identifiants SMTP que certified-courses et chordline-ventures :
# a poser avec `wrangler secret put`, jamais dans ce fichier (le depot est public).
name = "leclosdesclefs-contact"
account_id = "72f2189e4af7b47633523e17336f4d6a"   # Music Hackspace and Chordline Ventures (zone leclosdesclefs.com)
main = "src/index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "api.leclosdesclefs.com", custom_domain = true }]

[vars]
MAILGUN_SMTP_HOST = "smtp.eu.mailgun.org"
MAILGUN_SMTP_PORT = "587"
CONTACT_TO_EMAIL = "jb@musichackspace.org"
CONTACT_FROM_NAME = "Le Clos des Clefs"
CONTACT_FROM_EMAIL = "noreply@mail.musichackspace.org"
ALLOWED_ORIGINS = "https://leclosdesclefs.com,https://www.leclosdesclefs.com"

# Secrets (wrangler secret put) :
#   MAILGUN_SMTP_USER
#   MAILGUN_SMTP_PASSWORD
